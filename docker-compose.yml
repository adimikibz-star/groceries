version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groceries-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
    restart: unless-stopped
    networks:
      - groceries-network

networks:
  groceries-network:
    driver: bridge
